name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify Pi domain validation file
        run: |
          test -f public/validation-key.txt
          test -s public/validation-key.txt

      - name: Verify static app files
        run: |
          test -f public/index.html
          test -f public/js/app.js
          test -f api/payments/approve.js
